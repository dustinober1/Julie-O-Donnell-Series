name: Phase 3 Series Bible Import

on:
  push:
    branches:
      - migration/reconcile-series-bible
    paths:
      - "migration/.staging/phase3/READY"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/reconcile-series-bible
          fetch-depth: 0
      - name: Verify and extract migration payload
        shell: bash
        run: |
          set -euo pipefail
          cat migration/.staging/phase3/part*.b64 | base64 --decode > /tmp/phase3-import.tar.gz
          echo "41ab34731046fddabd647a7c180addd855d61859246f552823ea7749a3128a4f  /tmp/phase3-import.tar.gz" | sha256sum -c -
          tar -tzf /tmp/phase3-import.tar.gz | while IFS= read -r path; do
            case "$path" in
              /*|*../*) echo "Unsafe archive path: $path"; exit 1 ;;
            esac
          done
          tar -xzf /tmp/phase3-import.tar.gz -C .
          rm -rf migration/.staging/phase3
          rm -f .github/workflows/phase3-series-bible-import.yml
      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Import series handoffs and preserve Book 1 Drive variants"
          git push origin HEAD:migration/reconcile-series-bible
