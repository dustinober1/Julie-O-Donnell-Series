name: Book 1 Builder State Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/build_book1_production.py"
      - "tools/build_book1_production.payload.part*"
      - ".github/workflows/book1-builder-state-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inspect verified builder payload state checks
        run: |
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          base = Path('tools')
          names = [
              'build_book1_production.payload.part01a',
              'build_book1_production.payload.part01b',
              'build_book1_production.payload.part01c',
              'build_book1_production.payload.part01d',
              'build_book1_production.payload.part01e',
              'build_book1_production.payload.part01f',
              'build_book1_production.payload.part02',
              'build_book1_production.payload.part03',
              'build_book1_production.payload.part04',
              'build_book1_production.payload.part05',
          ]
          payload = ''.join((base / name).read_text(encoding='ascii') for name in names)
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          for token in (
              'developmentally_revised',
              'proofread_and_production_required',
              'publication_master_frozen',
              'publication_ready_upload_ready',
              'production_proofs_generated_pending_manual_approval',
          ):
              print(f'TOKEN {token!r}: {source.count(token)}')
              for match in list(re.finditer(re.escape(token), source))[:5]:
                  start = max(0, match.start() - 220)
                  end = min(len(source), match.end() + 220)
                  print(source[start:end].replace('\n', '\\n'))
          start = source.find('def load_context')
          end = source.find('\ndef ', start + 5)
          print('LOAD_CONTEXT_BEGIN')
          print(source[start:end])
          print('LOAD_CONTEXT_END')
          PY
